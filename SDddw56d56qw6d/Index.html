<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Planilha</title>

<style>
    :root {
        --bg: #f4f6f9;
        --card: #ffffff;
        --primary: #1a73e8;
        --shadow: 0 10px 30px rgba(0,0,0,0.08);
        --radius: 14px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header {
        padding: 18px 24px;
        background: var(--card);
        box-shadow: var(--shadow);
        font-weight: 600;
        font-size: 18px;
        color: #333;
    }

    .container {
        flex: 1;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .iframe-wrapper {
        width: 100%;
        max-width: 1400px;
        height: 85vh;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    iframe {
        flex: 1;
        width: 100%;
        border: none;
    }

    footer {
        text-align: center;
        padding: 15px;
        font-size: 14px;
        color: #777;
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {
        .iframe-wrapper {
            height: 88vh;
            border-radius: 0;
        }

        header {
            font-size: 16px;
            padding: 14px;
        }

        .container {
            padding: 0;
        }
    }
</style>
</head>

<body>

<header>
    📊 Teste de relatório
</header>

<div class="container">
    <div class="iframe-wrapper">
        <iframe 
            src="https://airtable.com/embed/appAlu9ED0tCnfRWw/shrMr9qNbiTIN0lrf"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </div>
</div>

<footer>
    © 2026 - Teste de relatorio acesso restrito ao link fornecido. Desenvolvido por Gustavo S.
</footer>

</body>
</html>
